# The perturbation grid. Each axis lists named levels; the engine composes the
# axes in declaration order. Mutation axes that change element *content*
# (ablation, language) must be declared before the rendering axis (format), so
# that format renders the already-perturbed elements into the final document.
axes:
  ablation:
    - id: baseline
      drop: []
    - id: no_molecular
      drop: ["molecular_report"]
    - id: no_imaging
      drop: ["imaging_text"]
    - id: no_pathology
      drop: ["pathology_report"]
    - id: no_context
      drop: ["prior_notes", "meds"]
  language:
    - id: en
      lang: en
    - id: de
      lang: de
  format:
    - id: structured
      style: structured
    - id: raw_dump
      style: raw_dump
    - id: tabular
      style: tabular
