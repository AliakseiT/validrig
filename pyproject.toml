[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-factory"
version = "0.1.0"
description = "The Harness Factory — an evaluation harness factory for LLM-based clinical workflows"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Aliaksei Tsitovich" }]
dependencies = [
    "pydantic>=2.6",
    "pyarrow>=15",
    "httpx>=0.27",
    "numpy>=1.26",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
harness = "harness.cli:main"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
