[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "validrig"
version = "0.1.0"
description = "validrig — the DearAuditor Eval engine: an evaluation harness factory for LLM-based clinical workflows"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Aliaksei Tsitovich" }]
dependencies = [
    "pydantic>=2.6",
    "pyarrow>=15",
    "httpx>=0.27",
    "numpy>=1.26",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fastapi>=0.110", "jinja2>=3", "python-multipart>=0.0.9", "uvicorn>=0.29"]
# Human-in-the-loop calibration/adjudication review UI. Kept out of the core so a
# site that only runs batteries never installs a web stack.
ui = ["fastapi>=0.110", "jinja2>=3", "python-multipart>=0.0.9", "uvicorn>=0.29"]
# Ingestion-boundary pseudonymization (lightweight Presidio). Also requires a
# small spaCy model: python -m spacy download en_core_web_sm  (or pip install the
# en_core_web_sm wheel). No transformer/HF models in this lightweight mode.
deid = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2", "spacy>=3.7"]

[project.scripts]
rig = "validrig.cli:main"
# Legacy alias kept through the harness → validrig rename; will be dropped later.
harness = "validrig.cli:main"

[tool.setuptools.packages.find]
include = ["validrig*", "harness"]

[tool.setuptools.package-data]
"validrig.ui" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
